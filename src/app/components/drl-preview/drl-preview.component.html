<div class="drl-container">

  <!-- En-tête -->
  <div class="drl-header">
    <div class="drl-header-left">
      <span class="drl-badge">DRL</span>
      <span class="drl-title">Drools Rule Language — Règle exécutable</span>
    </div>
    <button class="drl-copy-btn" (click)="copier()">
      {{ copied ? '✓ Copié !' : '📋 Copier' }}
    </button>
  </div>

  <!-- Phrase source -->
  <div *ngIf="phraseOriginale" class="drl-phrase-source">
    <span class="drl-phrase-icon">💬</span>
    <em>Phrase source : « {{ phraseOriginale }} »</em>
  </div>

  <!-- Code DRL avec coloration -->
  <div class="drl-code-wrapper">
    <div class="drl-line-numbers">
      <span *ngFor="let l of lignes; let i = index" class="drl-line-num">{{ i + 1 }}</span>
    </div>
    <pre class="drl-pre"><code class="drl-code"><span
      *ngFor="let l of lignes"
      class="drl-line"
      [class.drl-line-import]="l.type === 'import'"
      [class.drl-line-rule]="l.type === 'rule'"
      [class.drl-line-keyword]="l.type === 'keyword'"
      [class.drl-line-variable]="l.type === 'variable'"
      [class.drl-line-comment]="l.type === 'comment'"
      [class.drl-line-type]="l.type === 'type'"
      [class.drl-line-empty]="l.type === 'empty'">{{ l.text }}
</span></code></pre>
  </div>

</div>
